[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=domain",
    "--cov=server",
    "--cov=pet_repository",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["domain", "server", "pet_repository"]

[tool.coverage.report]
fail_under = 80
show_missing = true
