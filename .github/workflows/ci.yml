name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest

      - name: Check min coverage for pet.py
        run: python -m coverage report --include="domain/pet.py" --fail-under=100

  postman:
    name: API tests (Postman / Newman)
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://root:root_password@localhost:27017/virtual_pet?authSource=admin

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root_password
        options: >-
          --health-cmd "mongosh --quiet -u root -p root_password --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install --global newman@6

      - name: Run Postman collection
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8008 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8008/api/v1/pets > /dev/null; then
              break
            fi
            sleep 0.5
          done
          newman run postman/virtual-pet.postman_collection.json \
            --environment postman/local.postman_environment.json \
            --env-var "baseUrl=http://127.0.0.1:8008" \
            --reporters cli,junit \
            --reporter-junit-export newman-results/junit.xml

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-results/
          if-no-files-found: ignore

  lint:
    name: Lint (PEP 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run ruff (format check)
        run: ruff format --check .
